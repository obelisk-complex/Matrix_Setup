# PostgreSQL compose fragment
# Generated by Matrix Stack Setup

# @section services
  postgres:
    image: {{POSTGRES_IMAGE}}
    container_name: matrix-postgres
    restart: unless-stopped
    networks:
      - matrix-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
{{#ENV_SECRETS}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
{{/ENV_SECRETS}}
{{#PODMAN_SECRETS}}
      # The image aborts when POSTGRES_PASSWORD is set as well, so the _FILE
      # form replaces it rather than sitting alongside it.
      POSTGRES_PASSWORD_FILE: /run/secrets/matrix-postgres-password
{{/PODMAN_SECRETS}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-synapse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
{{#PODMAN_SECRETS}}
    secrets:
      - matrix-postgres-password

# @section secrets
  matrix-postgres-password:
    external: true
{{/PODMAN_SECRETS}}
