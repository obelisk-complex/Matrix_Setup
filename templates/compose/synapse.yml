# Synapse homeserver compose fragment
# Generated by Matrix Stack Setup

services:
  homeserver:
    image: {{SYNAPSE_IMAGE}}
    container_name: matrix-synapse
    restart: unless-stopped
    networks:
      - matrix-net
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - {{INSTALL_DIR}}/config/homeserver.yaml:/data/homeserver.yaml:ro{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/config/log.config:/data/log.config:ro{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/data/media:/data/media_store{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/data/signing-keys:/data/signing-keys{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/data/logs:/data/logs{{VOLUME_LABEL}}
{{#HAS_APPSERVICES}}
      - {{INSTALL_DIR}}/config/appservices:/data/appservices:ro{{VOLUME_LABEL}}
{{/HAS_APPSERVICES}}
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    env_file:
      - {{INSTALL_DIR}}/.env
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports: []
