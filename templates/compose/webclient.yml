# Web client compose fragment
# Generated by Matrix Stack Setup

# @section services
  webclient:
    image: {{WEBCLIENT_IMAGE}}
    container_name: matrix-webclient
    restart: unless-stopped
    networks:
      - matrix-net
    volumes:
      - {{INSTALL_DIR}}/config/{{WEBCLIENT_CONFIG_FILE}}:/app/config.json:ro{{VOLUME_LABEL}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
{{#PROXY_EXTERNAL}}
    # Reachable for an external proxy only through a published port; the image
    # itself listens on 80. Bound to proxy.bind_address, loopback by default.
    ports:
      - "{{PROXY_BIND}}:{{WEBCLIENT_PORT}}:80"
{{/PROXY_EXTERNAL}}
