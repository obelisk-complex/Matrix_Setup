# Coturn TURN/STUN compose fragment
# Generated by Matrix Stack Setup
# NOTE: Coturn runs rootful with host networking for reliable UDP relay.
# This is deployed as a SEPARATE compose file / Quadlet unit.

services:
  coturn:
    image: {{COTURN_IMAGE}}
    container_name: matrix-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - {{INSTALL_DIR}}/config/turnserver.conf:/etc/coturn/turnserver.conf:ro
{{#TLS}}
      - {{INSTALL_DIR}}/data/caddy/data/caddy/certificates:/etc/coturn/certs:ro
{{/TLS}}
    command: ["-c", "/etc/coturn/turnserver.conf"]
    healthcheck:
      test: ["CMD-SHELL", "turnutils_uclient -T -e 127.0.0.1 -p {{STUN_PORT}} 127.0.0.1 2>&1 | grep -q 'success' || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
