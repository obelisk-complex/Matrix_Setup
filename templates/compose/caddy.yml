# Caddy reverse proxy compose fragment
# Generated by Matrix Stack Setup

# @section services
  caddy:
    image: {{CADDY_IMAGE}}
    container_name: matrix-caddy
    restart: unless-stopped
    networks:
      - matrix-net
    depends_on:
      homeserver:
        condition: service_healthy
    volumes:
      - {{INSTALL_DIR}}/config/Caddyfile:/etc/caddy/Caddyfile:ro{{VOLUME_LABEL}}
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "{{CADDY_HTTP_PORT}}:{{PORT_HTTP}}"
      - "{{CADDY_HTTPS_PORT}}:{{PORT_HTTPS}}"
{{#FEDERATION}}
      - "{{FEDERATION_PORT}}:{{FEDERATION_PORT}}"
{{/FEDERATION}}
    environment:
      DOMAIN: {{DOMAIN}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2019/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
