# Monitoring stack compose fragment (Prometheus + Grafana)
# Generated by Matrix Stack Setup

# @section services
  prometheus:
    image: {{PROMETHEUS_IMAGE}}
    container_name: matrix-prometheus
    restart: unless-stopped
    networks:
      - matrix-net
    volumes:
      - {{INSTALL_DIR}}/config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro{{VOLUME_LABEL}}
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: {{GRAFANA_IMAGE}}
    container_name: matrix-grafana
    restart: unless-stopped
    networks:
      - matrix-net
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - {{INSTALL_DIR}}/config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro{{VOLUME_LABEL}}
    environment:
      GF_SECURITY_ADMIN_USER: admin
{{#ENV_SECRETS}}
      # No ':-admin' fallback: admin_password is set once on Grafana's first
      # run, so a placeholder that survives that start is permanent.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
{{/ENV_SECRETS}}
{{#PODMAN_SECRETS}}
      # The Grafana entrypoint reads any GF_*__FILE variable from the file it
      # names, and exits if the plain variable is set as well.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/matrix-grafana-password
{{/PODMAN_SECRETS}}
      GF_SERVER_ROOT_URL: "https://{{GRAFANA_SUBDOMAIN}}.{{DOMAIN}}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
{{#PODMAN_SECRETS}}
    secrets:
      - matrix-grafana-password
{{/PODMAN_SECRETS}}

# @section volumes
  prometheus-data:
  grafana-data:
{{#PODMAN_SECRETS}}

# @section secrets
  matrix-grafana-password:
    external: true
{{/PODMAN_SECRETS}}
