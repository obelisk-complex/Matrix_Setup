# Monitoring stack compose fragment (Prometheus + Grafana)
# Generated by Matrix Stack Setup

services:
  prometheus:
    image: {{PROMETHEUS_IMAGE}}
    container_name: matrix-prometheus
    restart: unless-stopped
    networks:
      - matrix-net
    volumes:
      - {{INSTALL_DIR}}/config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro{{VOLUME_LABEL}}
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: {{GRAFANA_IMAGE}}
    container_name: matrix-grafana
    restart: unless-stopped
    networks:
      - matrix-net
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - {{INSTALL_DIR}}/config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro{{VOLUME_LABEL}}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: "https://{{GRAFANA_SUBDOMAIN}}.{{DOMAIN}}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prometheus-data:
  grafana-data:
