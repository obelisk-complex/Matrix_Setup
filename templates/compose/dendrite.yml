# Dendrite homeserver compose fragment
# Generated by Matrix Stack Setup

# @section services
  homeserver:
    image: {{DENDRITE_IMAGE}}
    container_name: matrix-dendrite
    restart: unless-stopped
    networks:
      - matrix-net
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - {{INSTALL_DIR}}/config/dendrite.yaml:/etc/dendrite/dendrite.yaml:ro{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/data/media:/data/media_store{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/data/signing-keys:/etc/dendrite{{VOLUME_LABEL}}
      - {{INSTALL_DIR}}/data/jetstream:/data/jetstream{{VOLUME_LABEL}}
    command: ["--config", "/etc/dendrite/dendrite.yaml"]
{{#ENV_SECRETS}}
    env_file:
      - {{INSTALL_DIR}}/.env
{{/ENV_SECRETS}}
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://localhost:8008/_matrix/client/versions"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports: []
