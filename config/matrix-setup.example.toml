# Matrix Stack Setup — Example Configuration
# Copy this file and customize for headless (non-interactive) mode:
#   sudo bash setup.sh --headless --config my-config.toml
#
# Generate a fresh copy: sudo bash setup.sh --generate-config

# --- Domain ---
# IMPORTANT: The server name is PERMANENT. Cannot be changed after setup.
[domain]
name = "matrix.example.com"
confirmed = true    # Required in headless mode — you accept domain permanence

# --- Homeserver ---
[homeserver]
type = "synapse"    # "synapse" or "dendrite"

# --- Federation ---
[federation]
enabled = true

# --- Registration ---
[registration]
policy = "invite-only"  # "closed", "invite-only", "open-email", "open-captcha"
# recaptcha_public_key = ""   # Required if policy = "open-captcha"
# recaptcha_private_key = ""  # Required if policy = "open-captcha"

# --- Admin Account ---
[admin]
username = "admin"
# MUST be changed: placeholder values beginning with "changeme" (and other known
# defaults) are rejected by config validation. Use a strong, unique password.
password = "changeme-at-least-8-chars"

# --- Database ---
[database]
mode = "auto"       # "auto" (detect host PG or containerize), "container", "host"
# host = "localhost"  # Only if mode = "host"
# port = 5432
# user = "synapse"
# name = "synapse"

# --- Web Client ---
[webclient]
type = "element"    # "element", "cinny", "schildichat", "none"
subdomain = "chat"

# --- Coturn TURN/STUN ---
[coturn]
enabled = true
# min_port = 49152
# max_port = 65535

# --- SMTP (optional) ---
[smtp]
enabled = false
# host = "smtp.example.com"
# port = 587
# user = "noreply@example.com"
# password = "smtp-password"
# from = "noreply@matrix.example.com"

# --- Bridges (Synapse only) ---
[bridges]
enabled = ""        # Comma-separated: "telegram,discord,whatsapp,signal,slack,irc"

# Telegram bridge (if enabled)
# [bridges.telegram]
# api_id = "12345"
# api_hash = "0123456789abcdef"
# bot_token = "disabled"

# IRC bridge (if enabled)
# [bridges.irc]
# owner = "@admin:matrix.example.com"

# --- Admin UI (Synapse only) ---
[admin_ui]
enabled = true
subdomain = "admin"

# --- Monitoring (optional) ---
[monitoring]
enabled = false
grafana_subdomain = "grafana"

# --- Backup ---
[backup]
retention_daily = 7
retention_weekly = 4
encryption = "none" # "none", "gpg", "age"
# encryption_key = ""  # GPG key ID or age public key
upload = "none"     # "none", "rclone"
# upload_target = ""   # rclone remote path

# --- Server Hardening ---
[hardening]
ssh = true
firewall = true
fail2ban = true
sysctl = true
auto_updates = true

# Worth knowing before you enable `sysctl` above: it lowers the threshold for
# privileged ports to 80, because Caddy runs as an ordinary user and otherwise
# could not listen on 443 or obtain a TLS certificate. The side effect is that
# every account on this machine can then bind ports 80-1023 — someone with a
# shell account here could grab port 80 before Caddy does and take over
# certificate issuance for your domain.
# This is fine for one admin running a server for a small group, which is what
# this setup assumes. Do not hand out shell accounts on the machine that
# terminates your TLS.

# Every setting below is optional. The values shown are the defaults, and they
# match what the server does today — leaving this section alone changes nothing.

# Allow SSH port forwarding (tunnelling) to this machine.
# Leave this true unless you know you never tunnel to this box. Turning it off
# stops you reaching anything on the server through an SSH tunnel: the admin
# panel and Grafana if you open them that way, a database client pointed at the
# Postgres port, or a browser proxied through the server. It does not stop you
# logging in over SSH, and you can change it back by editing
# /etc/ssh/sshd_config.d/99-matrix-hardening.conf.
ssh_tcp_forwarding = true

# Use randomised, rotating IPv6 addresses for connections this server starts.
# Only turn this on if the server is at home on a connection where the IPv6
# address reveals something you would rather not publish. On a hosted server it
# gains you nothing and costs you clarity: outgoing traffic stops coming from
# the address in your DNS record, so firewall rules or allowlists elsewhere that
# name this server by its IPv6 address will stop matching it, and this setup
# script's own "does DNS point at this machine?" check may start warning.
# Incoming connections are unaffected either way.
# Has no effect at all if your provider gives you a fixed IPv6 address.
ipv6_privacy = false

# How many simultaneous network connections the kernel will track.
# Set this only if voice and video calls start dropping on a busy server — the
# giveaway is "nf_conntrack: table full" in `dmesg`. Each relayed call is many
# tracked connections, so a server with a lot of calls can run out while a quiet
# one never will. Costs a little memory and nothing else. 131072 is a sensible
# first try; leave it unset to let the kernel decide.
# conntrack_max = 131072

# --- Existing reverse proxy ---
# This only applies when setup finds a web server already holding ports 80/443
# and leaves it in charge instead of deploying Caddy. When that happens the
# homeserver's port is published on the address below so your nginx, Apache or
# Traefik has something to connect to, and the config snippets setup writes for
# you point at that same address.
# The default keeps the port on the loopback interface: any program running on
# this machine can reach it, and nothing on the network can. Change it only if
# your proxy runs on another machine or somewhere loopback will not reach it.
# Whatever address you give, anything that can reach it can talk to your
# homeserver directly, unencrypted and with nothing in front of it, so give the
# narrowest address that works. "0.0.0.0" means every interface, which on a
# server with a public IP address means the whole internet.
[proxy]
bind_address = "127.0.0.1"

# --- Secrets ---
[secrets]
mode = "env"        # "env" (.env file) or "podman" (Podman native secrets)

# --- Advanced ---
[advanced]
podman_compose_command = "auto"  # "auto", "podman compose", "podman-compose", "docker-compose"
# install_dir = "/opt/matrix"
# matrix_user = "matrix"
